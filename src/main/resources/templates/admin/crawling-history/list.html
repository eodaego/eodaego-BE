<!DOCTYPE html>
<html th:replace="~{admin/fragments/layout :: page('크롤링 실행 이력', 'crawling-history', ~{::main}, ~{})}"
      xmlns:th="http://www.thymeleaf.org">
<body>
<main class="page">
  <div class="head"><h1>크롤링 실행 이력</h1></div>
  <div class="toolbar"></div>
  <div id="crawling-history-list">
    <th:block th:fragment="listRegion">
      <div class="tablewrap">
        <table>
          <thead>
          <tr><th>작업 유형</th><th>결과</th><th>수집 건수</th><th>메시지</th><th>실행 시각</th><th></th></tr>
          </thead>
          <tbody>
          <tr th:each="entry : ${logPage.content}">
            <td th:text="${entry.jobType()}"></td>
            <td>
              <span class="badge" th:classappend="${entry.success()} ? 'badge-ok' : 'badge-bad'"
                    th:text="${entry.success()} ? '성공' : '실패'"></span>
            </td>
            <td class="numeric" th:text="${entry.collectedCount()}"></td>
            <td class="wrap" th:text="${entry.message()}"></td>
            <td th:text="${#temporals.format(entry.createdAt(), 'yyyy-MM-dd HH:mm')}"></td>
            <td>
              <form th:if="${retryableLogIds.contains(entry.id())}"
                    th:action="@{'/admin/crawling/retry/' + ${entry.jobType()}}" method="post"
                    th:attr="data-confirm=${entry.jobType()} + ' 작업을 다시 실행합니다.'">
                <input type="hidden" name="returnTo" value="history"/>
                <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn sm">재실행</button>
              </form>
            </td>
          </tr>
          </tbody>
        </table>
        <div class="empty" th:if="${logPage.content.isEmpty()}">실행 이력이 없습니다.</div>
      </div>
      <div th:replace="~{admin/fragments/components :: pager(${logPage})}"></div>
    </th:block>
  </div>
</main>
</body>
</html>
