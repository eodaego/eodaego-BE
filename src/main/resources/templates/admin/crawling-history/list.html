<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>크롤링 실행 이력 - 어대고 관리자</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css"/>
</head>
<body class="min-h-screen bg-base-200">
<div class="drawer lg:drawer-open">
  <input id="admin-drawer" type="checkbox" class="drawer-toggle"/>
  <div class="drawer-content flex flex-col">
    <div th:replace="~{admin/fragments/layout :: mobileTopbar}"></div>
    <main class="p-8">
  <div class="flex justify-between items-center mb-4">
    <h2 class="text-xl font-bold">크롤링 실행 이력</h2>
  </div>
  <div class="overflow-x-auto bg-base-100 rounded-box shadow">
    <table class="table">
      <thead>
      <tr>
        <th>작업 유형</th>
        <th>결과</th>
        <th>수집 건수</th>
        <th>메시지</th>
        <th>실행 시각</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="entry : ${logPage.content}">
        <td th:text="${entry.jobType()}"></td>
        <td>
          <span class="badge" th:classappend="${entry.success()} ? 'badge-success' : 'badge-error'"
                th:text="${entry.success()} ? '성공' : '실패'"></span>
        </td>
        <td th:text="${entry.collectedCount()}"></td>
        <td th:text="${entry.message()}"></td>
        <td th:text="${entry.createdAt()}"></td>
      </tr>
      </tbody>
    </table>
  </div>
  <div class="flex justify-center items-center gap-2 mt-4">
    <a th:if="${logPage.hasPrevious()}" th:href="@{/admin/crawling/history(page=${logPage.number - 1})}" class="btn btn-outline btn-sm">이전</a>
    <span class="btn btn-ghost btn-sm no-animation" th:text="${logPage.number + 1} + ' / ' + ${logPage.totalPages == 0 ? 1 : logPage.totalPages}"></span>
    <a th:if="${logPage.hasNext()}" th:href="@{/admin/crawling/history(page=${logPage.number + 1})}" class="btn btn-outline btn-sm">다음</a>
  </div>
    </main>
  </div>
  <div th:replace="~{admin/fragments/layout :: sidebarNav(activePage='crawling-history')}"></div>
</div>
</body>
</html>
