<!DOCTYPE html>
<html th:replace="~{admin/fragments/layout :: page((${mode == 'create'} ? '시설 등록' : '시설 수정'), 'facility', ~{::main}, ~{})}"
      xmlns:th="http://www.thymeleaf.org">
<body>
<main class="page">
  <div class="head"><h1 th:text="${mode == 'create'} ? '시설 등록' : '시설 수정'"></h1></div>
  <form th:action="${mode == 'create'} ? @{/admin/facility} : @{'/admin/facility/' + ${facilityId}}"
        th:object="${request}" method="post" class="card form-card">
    <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <div class="field">
      <label for="category">카테고리</label>
      <input id="category" type="text" th:field="*{category}"/>
      <span class="error-text" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></span>
    </div>
    <div class="field">
      <label for="name">이름</label>
      <input id="name" type="text" th:field="*{name}"/>
      <span class="error-text" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
    </div>
    <div class="field">
      <label for="code">코드</label>
      <input id="code" type="text" th:field="*{code}"/>
    </div>
    <div class="field">
      <label for="intro">소개</label>
      <input id="intro" type="text" th:field="*{intro}"/>
    </div>
    <div class="field">
      <label for="description">상세 설명</label>
      <textarea id="description" th:field="*{description}" rows="4"></textarea>
    </div>
    <div class="field">
      <label for="latitude">위도</label>
      <input id="latitude" type="number" step="any" th:field="*{latitude}"/>
    </div>
    <div class="field">
      <label for="longitude">경도</label>
      <input id="longitude" type="number" step="any" th:field="*{longitude}"/>
    </div>
    <div class="field">
      <label for="facilityType">세부 시설 유형</label>
      <input id="facilityType" type="text" th:field="*{facilityType}"/>
    </div>
    <div class="form-actions">
      <a th:href="@{/admin/facility}" class="btn">취소</a>
      <button type="submit" class="btn primary">저장</button>
    </div>
  </form>
</main>
</body>
</html>
