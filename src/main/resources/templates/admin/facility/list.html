<!DOCTYPE html>
<html th:replace="~{admin/fragments/layout :: page('시설 관리', 'facility', ~{::main}, ~{})}"
      xmlns:th="http://www.thymeleaf.org">
<body>
<main class="page">
  <div class="head">
    <h1>시설 관리</h1>
    <div class="spacer"></div>
    <div class="tools">
      <a th:href="@{/admin/facility/new}" class="btn primary">시설 등록</a>
      <form th:action="@{/admin/facility/import}" method="post" data-confirm="xlsx 파일에서 시설을 임포트합니다. 계속할까요?">
        <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit" class="btn">xlsx 임포트</button>
      </form>
    </div>
  </div>
  <div th:replace="~{admin/fragments/crawl-result :: single(result=${crawlResult})}"></div>
  <div class="toolbar">
    <form id="facility-search" th:action="@{/admin/facility}" method="get">
      <label class="search" style="min-width:220px">
        <span aria-hidden="true">⌕</span>
        <input type="search" name="keyword" th:value="${keyword}" placeholder="시설명·코드 검색" aria-label="시설명·코드 검색"
               hx-get="/admin/facility" hx-target="#facility-list" hx-push-url="true"
               hx-trigger="input changed delay:300ms, search" hx-include="#facility-sort-state"/>
      </label>
    </form>
  </div>
  <div id="facility-list">
    <th:block th:fragment="listRegion">
      <div id="facility-sort-state">
        <input type="hidden" form="facility-search" name="sort" th:value="${sort ?: ''}"/>
        <input type="hidden" form="facility-search" name="direction" th:value="${direction ?: ''}"/>
      </div>
      <div class="tools">
        <span class="subtitle" th:text="'총 ' + ${page.totalElements} + '건'"></span>
      </div>
      <div class="tablewrap">
        <table>
          <thead>
          <tr>
            <th th:replace="~{admin/fragments/components :: sortHeader('이름', 'name')}"></th>
            <th th:replace="~{admin/fragments/components :: sortHeader('카테고리', 'category')}"></th>
            <th th:replace="~{admin/fragments/components :: sortHeader('코드', 'code')}"></th>
            <th th:replace="~{admin/fragments/components :: sortHeader('유형', 'facilityType')}"></th>
            <th>소개</th><th>위도</th><th>경도</th>
            <th th:replace="~{admin/fragments/components :: sortHeader('수정일시', 'updatedAt')}"></th>
            <th></th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="facility : ${page.content}">
            <td th:text="${facility.name()}"></td>
            <td th:text="${facility.category()}"></td>
            <td th:text="${facility.code()}"></td>
            <td th:text="${facility.facilityType()}"></td>
            <td th:text="${facility.intro()}"></td>
            <td class="numeric" th:text="${facility.latitude()}"></td>
            <td class="numeric" th:text="${facility.longitude()}"></td>
            <td th:text="${#temporals.format(facility.updatedAt(), 'yyyy-MM-dd HH:mm')}"></td>
            <td>
              <div class="actions">
                <a th:href="@{'/admin/facility/' + ${facility.id()} + '/edit'}" class="btn sm">수정</a>
                <form th:action="@{'/admin/facility/' + ${facility.id()} + '/delete'}" method="post"
                      th:attr="data-confirm='시설 ' + ${facility.name()} + '을(를) 삭제합니다. 되돌릴 수 없습니다.'">
                  <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                  <button type="submit" class="btn sm danger">삭제</button>
                </form>
              </div>
            </td>
          </tr>
          </tbody>
        </table>
        <div class="empty" th:if="${#lists.isEmpty(page.content)}">조건에 맞는 시설이 없습니다.</div>
      </div>
      <div th:replace="~{admin/fragments/components :: pager(${page})}"></div>
    </th:block>
  </div>
</main>
</body>
</html>
