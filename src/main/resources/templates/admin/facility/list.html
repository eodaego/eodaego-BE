<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>시설 관리 - 어대고 관리자</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css"/>
</head>
<body class="min-h-screen bg-base-200">
<div class="drawer lg:drawer-open">
  <input id="admin-drawer" type="checkbox" class="drawer-toggle"/>
  <div class="drawer-content flex flex-col">
    <div th:replace="~{admin/fragments/layout :: mobileTopbar}"></div>
    <main class="p-8">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold">시설 관리</h2>
        <div class="flex gap-2">
          <a th:href="@{/admin/facility/new}" class="btn btn-primary btn-sm">시설 등록</a>
          <form th:action="@{/admin/facility/import}" method="post">
            <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-outline btn-sm">xlsx 임포트</button>
          </form>
        </div>
      </div>
      <div th:replace="~{admin/fragments/crawl-result :: single(result=${crawlResult})}"></div>
      <div class="overflow-x-auto bg-base-100 rounded-box shadow">
        <table class="table">
          <thead>
          <tr>
            <th>이름</th>
            <th>카테고리</th>
            <th>코드</th>
            <th>유형</th>
            <th>소개</th>
            <th>위도</th>
            <th>경도</th>
            <th>수정일시</th>
            <th></th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="facility : ${facilities}">
            <td th:text="${facility.name()}"></td>
            <td th:text="${facility.category()}"></td>
            <td th:text="${facility.code()}"></td>
            <td th:text="${facility.facilityType()}"></td>
            <td th:text="${facility.intro()}"></td>
            <td th:text="${facility.latitude()}"></td>
            <td th:text="${facility.longitude()}"></td>
            <td th:text="${facility.updatedAt()}"></td>
            <td class="flex gap-2">
              <a th:href="@{'/admin/facility/' + ${facility.id()} + '/edit'}" class="btn btn-outline btn-xs">수정</a>
              <form th:action="@{'/admin/facility/' + ${facility.id()} + '/delete'}" method="post">
                <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-outline btn-error btn-xs">삭제</button>
              </form>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
  <div th:replace="~{admin/fragments/layout :: sidebarNav(activePage='facility')}"></div>
</div>
</body>
</html>
