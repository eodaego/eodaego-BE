<!DOCTYPE html>
<html th:replace="~{admin/fragments/layout :: page('혼잡도 조회', 'congestion', ~{::main}, ~{})}"
      xmlns:th="http://www.thymeleaf.org">
<body>
<main class="page">
  <div class="head">
    <h1>혼잡도 조회</h1>
    <div class="spacer"></div>
    <form th:action="@{/admin/congestion/crawl}" method="post">
      <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <button type="submit" class="btn primary">지금 수집</button>
    </form>
  </div>
  <div th:replace="~{admin/fragments/crawl-result :: single(result=${crawlResult})}"></div>
  <div class="toolbar"></div>
  <div id="congestion-list">
    <th:block th:fragment="listRegion">
      <div class="tablewrap">
        <table>
          <thead>
          <tr><th>장소 키</th><th>혼잡도</th><th>메시지</th><th>최소 인원</th><th>최대 인원</th><th>수집일시</th></tr>
          </thead>
          <tbody>
          <tr th:each="snapshot : ${congestionSnapshots}">
            <td th:text="${snapshot.placeRefKey()}"></td>
            <td th:text="${snapshot.congestionLevel()}"></td>
            <td class="wrap" th:text="${snapshot.congestionMessage()}"></td>
            <td class="numeric" th:text="${snapshot.populationMin()}"></td>
            <td class="numeric" th:text="${snapshot.populationMax()}"></td>
            <td th:text="${#temporals.format(snapshot.collectedAt(), 'yyyy-MM-dd HH:mm')}"></td>
          </tr>
          </tbody>
        </table>
        <div class="empty" th:if="${#lists.isEmpty(congestionSnapshots)}">수집된 혼잡도가 없습니다.</div>
      </div>
    </th:block>
  </div>
</main>
</body>
</html>
