<!DOCTYPE html>
<html th:replace="~{admin/fragments/layout :: page((${mode == 'create'} ? '놀이기구 등록' : '놀이기구 수정'), 'amusement-rides', ~{::main}, ~{})}"
      xmlns:th="http://www.thymeleaf.org">
<body>
<main class="page">
  <div class="head"><h1 th:text="${mode == 'create'} ? '놀이기구 등록' : '놀이기구 수정'"></h1></div>
  <form th:action="${mode == 'create'} ? @{/admin/facility/amusement-rides} : @{'/admin/facility/amusement-rides/' + ${rideId}}"
        th:object="${request}" method="post" class="card form-card">
    <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <div class="field">
      <label for="name">이름</label>
      <input id="name" type="text" th:field="*{name}"/>
      <span class="error-text" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
    </div>
    <div class="field">
      <label for="description">설명</label>
      <textarea id="description" th:field="*{description}" rows="4"></textarea>
    </div>
    <div class="field">
      <label for="location">위치</label>
      <input id="location" type="text" th:field="*{location}"/>
    </div>
    <label class="check" for="active">
      <input id="active" type="checkbox" th:field="*{active}"/>
      <span>운영 중</span>
    </label>
    <div class="form-actions">
      <a th:href="@{/admin/facility/amusement-rides}" class="btn">취소</a>
      <button type="submit" class="btn primary">저장</button>
    </div>
  </form>
</main>
</body>
</html>
