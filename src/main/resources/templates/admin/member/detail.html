<!DOCTYPE html>
<html th:replace="~{admin/fragments/layout :: page('회원 상세', 'member-list', ~{::main}, ~{})}"
      xmlns:th="http://www.thymeleaf.org">
<body>
<main class="page">
  <div class="head">
    <h1>회원 상세</h1>
    <div class="spacer"></div>
    <a th:href="@{/admin/members}" class="btn">목록으로</a>
  </div>
  <section class="card">
    <h2>회원 정보</h2>
    <div class="tablewrap">
      <table>
        <tbody>
        <tr><th class="detail-label">닉네임</th><td th:text="${member.nickname()}"></td></tr>
        <tr><th class="detail-label">이메일</th><td th:text="${member.email()}"></td></tr>
        <tr><th class="detail-label">소셜타입</th><td th:text="${member.socialType()}"></td></tr>
        <tr><th class="detail-label">기기타입</th><td th:text="${member.deviceType()}"></td></tr>
        <tr><th class="detail-label">가입일</th><td th:text="${#temporals.format(member.createdAt(), 'yyyy-MM-dd HH:mm')}"></td></tr>
        </tbody>
      </table>
    </div>
  </section>
  <section class="card">
    <h2>약관/마케팅 동의 이력</h2>
    <div class="tablewrap">
      <table>
        <thead>
        <tr><th>항목</th><th>동의 여부</th><th>동의 일시</th></tr>
        </thead>
        <tbody>
        <tr>
          <td>개인정보 처리방침</td>
          <td th:text="${member.privacyPolicyAgreed()} ? '동의' : '미동의'"></td>
          <td>-</td>
        </tr>
        <tr>
          <td>위치정보 이용약관</td>
          <td th:text="${member.locationInfoAgreed()} ? '동의' : '미동의'"></td>
          <td>-</td>
        </tr>
        <tr>
          <td>서비스 이용약관</td>
          <td th:text="${member.termsOfServiceAgreed()} ? '동의' : '미동의'"></td>
          <td th:text="${member.termsAgreedAt() != null} ? ${#temporals.format(member.termsAgreedAt(), 'yyyy-MM-dd HH:mm')} : '-'"></td>
        </tr>
        <tr>
          <td>마케팅 정보 수신</td>
          <td th:text="${member.marketingAgreed()} ? '동의' : '미동의'"></td>
          <td th:text="${member.marketingAgreedAt() != null} ? ${#temporals.format(member.marketingAgreedAt(), 'yyyy-MM-dd HH:mm')} : '-'"></td>
        </tr>
        </tbody>
      </table>
    </div>
  </section>
</main>
</body>
</html>
