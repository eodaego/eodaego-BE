<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>회원 목록 - 어대고 관리자</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css"/>
</head>
<body class="min-h-screen bg-base-200">
<div class="drawer lg:drawer-open">
  <input id="admin-drawer" type="checkbox" class="drawer-toggle"/>
  <div class="drawer-content flex flex-col">
    <div th:replace="~{admin/fragments/layout :: mobileTopbar}"></div>
    <main class="p-8">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold">회원 목록</h2>
      </div>
      <form th:action="@{/admin/members}" method="get" class="flex gap-2 mb-4">
        <input type="text" name="keyword" th:value="${keyword}" placeholder="닉네임 또는 이메일 검색"
               class="input input-bordered input-sm w-64"/>
        <select name="socialType" class="select select-bordered select-sm">
          <option value="" th:selected="${socialType == null}">전체 소셜타입</option>
          <option value="GOOGLE" th:selected="${socialType == T(com.chuseok22.eodaegoserver.domain.member.SocialType).GOOGLE}">GOOGLE</option>
          <option value="APPLE" th:selected="${socialType == T(com.chuseok22.eodaegoserver.domain.member.SocialType).APPLE}">APPLE</option>
        </select>
        <button type="submit" class="btn btn-primary btn-sm">검색</button>
      </form>
      <div class="overflow-x-auto bg-base-100 rounded-box shadow">
        <table class="table">
          <thead>
          <tr>
            <th>닉네임</th>
            <th>이메일</th>
            <th>소셜타입</th>
            <th>기기타입</th>
            <th>가입일</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="entry : ${memberPage.content}">
            <td>
              <a th:href="@{'/admin/members/' + ${entry.id()}}" class="link link-primary" th:text="${entry.nickname()}"></a>
            </td>
            <td th:text="${entry.email()}"></td>
            <td th:text="${entry.socialType()}"></td>
            <td th:text="${entry.deviceType()}"></td>
            <td th:text="${entry.createdAt()}"></td>
          </tr>
          </tbody>
        </table>
      </div>
      <div class="flex justify-center items-center gap-2 mt-4">
        <a th:if="${memberPage.hasPrevious()}"
           th:href="@{/admin/members(keyword=${keyword}, socialType=${socialType}, page=${memberPage.number - 1})}"
           class="btn btn-outline btn-sm">이전</a>
        <span class="btn btn-ghost btn-sm no-animation"
              th:text="${memberPage.number + 1} + ' / ' + ${memberPage.totalPages == 0 ? 1 : memberPage.totalPages}"></span>
        <a th:if="${memberPage.hasNext()}"
           th:href="@{/admin/members(keyword=${keyword}, socialType=${socialType}, page=${memberPage.number + 1})}"
           class="btn btn-outline btn-sm">다음</a>
      </div>
    </main>
  </div>
  <div th:replace="~{admin/fragments/layout :: sidebarNav(activePage='member-list')}"></div>
</div>
</body>
</html>
