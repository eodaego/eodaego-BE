<!DOCTYPE html>
<html th:replace="~{admin/fragments/layout :: page('회원 목록', 'member-list', ~{::main}, ~{})}"
      xmlns:th="http://www.thymeleaf.org">
<body>
<main class="page">
  <div class="head"><h1>회원 목록</h1></div>
  <div class="toolbar">
    <form id="member-search" th:action="@{/admin/members}" method="get">
      <label class="search" style="min-width:220px">
        <span aria-hidden="true">⌕</span>
        <input type="search" name="keyword" th:value="${query.keyword}" placeholder="닉네임 또는 이메일 검색" aria-label="닉네임 또는 이메일 검색"
               hx-get="/admin/members" hx-target="#member-list" hx-push-url="true"
               hx-trigger="input changed delay:300ms, search" hx-include="#member-filter-state"/>
      </label>
    </form>
  </div>
  <div id="member-list">
    <th:block th:fragment="listRegion"
              th:with="socialTypeValue=${query.socialType != null ? query.socialType.name() : ''},
                       deviceTypeValue=${query.deviceType != null ? query.deviceType.name() : ''},
                       keywordValue=${query.keyword ?: ''}, sortValue=${query.sort ?: ''}, directionValue=${query.direction ?: ''}">
      <div id="member-filter-state">
        <input type="hidden" form="member-search" name="socialType" th:value="${socialTypeValue}"/>
        <input type="hidden" form="member-search" name="deviceType" th:value="${deviceTypeValue}"/>
        <input type="hidden" form="member-search" name="sort" th:value="${sortValue}"/>
        <input type="hidden" form="member-search" name="direction" th:value="${directionValue}"/>
      </div>
      <div class="tools">
        <a th:each="chip : ${ {{'', '전체 소셜'}, {'GOOGLE', 'GOOGLE'}, {'APPLE', 'APPLE'}} }"
           class="chip" th:classappend="${socialTypeValue == chip[0]} ? 'on'" th:text="${chip[1]}"
           th:href="@{/admin/members(socialType=${chip[0]}, deviceType=${deviceTypeValue}, keyword=${keywordValue}, sort=${sortValue}, direction=${directionValue})}"
           th:attr="hx-get=@{/admin/members(socialType=${chip[0]}, deviceType=${deviceTypeValue}, keyword=${keywordValue}, sort=${sortValue}, direction=${directionValue})}"
           hx-target="#member-list" hx-push-url="true"></a>
        <a th:each="chip : ${ {{'', '전체 기기'}, {'IOS', 'IOS'}, {'ANDROID', 'ANDROID'}} }"
           class="chip" th:classappend="${deviceTypeValue == chip[0]} ? 'on'" th:text="${chip[1]}"
           th:href="@{/admin/members(socialType=${socialTypeValue}, deviceType=${chip[0]}, keyword=${keywordValue}, sort=${sortValue}, direction=${directionValue})}"
           th:attr="hx-get=@{/admin/members(socialType=${socialTypeValue}, deviceType=${chip[0]}, keyword=${keywordValue}, sort=${sortValue}, direction=${directionValue})}"
           hx-target="#member-list" hx-push-url="true"></a>
        <div class="spacer"></div>
        <span class="subtitle" th:text="'총 ' + ${memberPage.totalElements} + '명'"></span>
        <a class="btn sm"
           th:href="@{/admin/members/export(socialType=${socialTypeValue}, deviceType=${deviceTypeValue}, keyword=${keywordValue}, sort=${sortValue}, direction=${directionValue})}">CSV 내보내기</a>
      </div>
      <div class="tablewrap">
        <table>
          <thead>
          <tr>
            <th th:replace="~{admin/fragments/components :: sortHeader('닉네임', 'nickname')}"></th>
            <th>이메일</th>
            <th th:replace="~{admin/fragments/components :: sortHeader('소셜타입', 'socialType')}"></th>
            <th th:replace="~{admin/fragments/components :: sortHeader('기기타입', 'deviceType')}"></th>
            <th th:replace="~{admin/fragments/components :: sortHeader('가입일', 'createdAt')}"></th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="entry : ${memberPage.content}">
            <td><a th:href="@{'/admin/members/' + ${entry.id()}}" th:text="${entry.nickname()}"></a></td>
            <td th:text="${entry.email()}"></td>
            <td th:text="${entry.socialType()}"></td>
            <td th:text="${entry.deviceType()}"></td>
            <td th:text="${#temporals.format(entry.createdAt(), 'yyyy-MM-dd HH:mm')}"></td>
          </tr>
          </tbody>
        </table>
        <div class="empty" th:if="${memberPage.content.isEmpty()}">조건에 맞는 회원이 없습니다.</div>
      </div>
      <div th:replace="~{admin/fragments/components :: pager(${memberPage})}"></div>
    </th:block>
  </div>
</main>
</body>
</html>
