<!DOCTYPE html>
<html th:replace="~{admin/fragments/layout :: page('운영시간 조회', 'operating-hours', ~{::main}, ~{})}"
      xmlns:th="http://www.thymeleaf.org">
<body>
<main class="page">
  <div class="head">
    <h1>운영시간 조회</h1>
    <div class="spacer"></div>
    <form th:action="@{/admin/facility/operating-hours/crawl}" method="post">
      <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <button type="submit" class="btn primary">지금 수집</button>
    </form>
  </div>
  <div th:replace="~{admin/fragments/crawl-result :: single(result=${crawlResult})}"></div>
  <div class="toolbar"></div>
  <div id="operating-hours-list">
    <th:block th:fragment="listRegion">
      <div class="list">
        <section class="card" th:each="section : ${operatingHoursSections}">
          <h2 th:text="${section.sectionTitle()}"></h2>
          <div th:utext="${section.contentHtml()}"></div>
          <p class="subtitle" th:text="'수집일시: ' + ${#temporals.format(section.collectedAt(), 'yyyy-MM-dd HH:mm')}"></p>
        </section>
        <div class="empty" th:if="${#lists.isEmpty(operatingHoursSections)}">수집된 운영시간이 없습니다.</div>
      </div>
    </th:block>
  </div>
</main>
</body>
</html>
