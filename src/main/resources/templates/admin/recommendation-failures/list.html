<!DOCTYPE html>
<html th:replace="~{admin/fragments/layout :: page('AI 추천 실패 로그', 'recommendation-failures', ~{::main}, ~{})}"
      xmlns:th="http://www.thymeleaf.org">
<body>
<main class="page">
  <div class="head"><h1>AI 추천 실패 로그</h1></div>
  <div class="toolbar"></div>
  <div id="recommendation-failures-list">
    <th:block th:fragment="listRegion">
      <div class="tablewrap">
        <table>
          <thead>
          <tr><th>실패 유형</th><th>메시지</th><th>발생 시각</th></tr>
          </thead>
          <tbody>
          <tr th:each="entry : ${logPage.content}">
            <td th:text="${entry.failureType()}"></td>
            <td class="wrap" th:text="${entry.message()}"></td>
            <td th:text="${#temporals.format(entry.createdAt(), 'yyyy-MM-dd HH:mm')}"></td>
          </tr>
          </tbody>
        </table>
        <div class="empty" th:if="${logPage.content.isEmpty()}">실패 로그가 없습니다.</div>
      </div>
      <div th:replace="~{admin/fragments/components :: pager(${logPage})}"></div>
    </th:block>
  </div>
</main>
</body>
</html>
