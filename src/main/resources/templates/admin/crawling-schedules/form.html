<!DOCTYPE html>
<html th:replace="~{admin/fragments/layout :: page((${mode == 'create'} ? '크롤링 스케줄 등록' : '크롤링 스케줄 수정'), 'crawling-schedules', ~{::main}, ~{})}"
      xmlns:th="http://www.thymeleaf.org">
<body>
<main class="page">
  <div class="head"><h1 th:text="${mode == 'create'} ? '크롤링 스케줄 등록' : '크롤링 스케줄 수정'"></h1></div>
  <form th:action="${mode == 'create'} ? @{/admin/crawling/schedules} : @{'/admin/crawling/schedules/' + ${scheduleId}}"
        th:object="${request}" method="post" class="card form-card">
    <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <div class="field" th:if="${mode == 'create'}">
      <label for="jobId">작업 ID</label>
      <input id="jobId" type="text" th:field="*{jobId}"/>
      <span class="error-text" th:if="${#fields.hasErrors('jobId')}" th:errors="*{jobId}"></span>
    </div>
    <div class="field" th:if="${mode == 'edit'}">
      <label for="jobIdReadonly">작업 ID</label>
      <input id="jobIdReadonly" type="text" th:value="${jobId}" disabled/>
    </div>
    <div class="field">
      <label for="triggerType">트리거 유형</label>
      <select id="triggerType" th:field="*{triggerType}">
        <option value="interval">interval</option>
        <option value="cron">cron</option>
      </select>
      <span class="error-text" th:if="${#fields.hasErrors('triggerType')}" th:errors="*{triggerType}"></span>
    </div>
    <div class="field">
      <label for="triggerConfig">트리거 설정값</label>
      <input id="triggerConfig" type="text" th:field="*{triggerConfig}" placeholder="interval: 초 단위 숫자, cron: cron 표현식"/>
      <span class="error-text" th:if="${#fields.hasErrors('triggerConfig')}" th:errors="*{triggerConfig}"></span>
    </div>
    <label class="check" for="active">
      <input id="active" type="checkbox" th:field="*{active}"/>
      <span>활성화</span>
    </label>
    <div class="form-actions">
      <a th:href="@{/admin/crawling/schedules}" class="btn">취소</a>
      <button type="submit" class="btn primary">저장</button>
    </div>
  </form>
</main>
</body>
</html>
