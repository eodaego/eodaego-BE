<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>도감 항목 수정 - 어대고 관리자</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css"/>
</head>
<body class="min-h-screen bg-base-200">
<div class="drawer lg:drawer-open">
  <input id="admin-drawer" type="checkbox" class="drawer-toggle"/>
  <div class="drawer-content flex flex-col">
    <div th:replace="~{admin/fragments/layout :: mobileTopbar}"></div>
    <main class="p-8">
      <h2 class="text-xl font-bold mb-1">도감 항목 수정</h2>
      <p class="text-sm text-base-content/60 mb-4">
        <span th:text="'현재 표시 이름: ' + ${item.name()}"></span> ·
        <span th:text="'카테고리: ' + ${item.category()}"></span>
      </p>
      <div class="mb-4 p-4 bg-base-100 rounded-box shadow text-sm max-w-lg">
        <p class="font-semibold mb-2">AI 원본 값 (참고용, override와 무관하게 항상 원본 그대로 표시)</p>
        <p>이름: <span th:text="${originalName}"></span></p>
        <p>특징: <span th:text="${originalFeature}"></span></p>
        <p th:if="${originalImageUrl != null}">이미지 URL: <span th:text="${originalImageUrl}"></span></p>
        <p th:if="${originalLatitude != null}">
          위도: <span th:text="${originalLatitude}"></span> / 경도: <span th:text="${originalLongitude}"></span>
        </p>
      </div>
      <form th:action="@{'/admin/catalog/items/' + ${catalogItemId}}" th:object="${request}" method="post"
            class="card bg-base-100 shadow-xl p-6 max-w-lg">
        <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div class="form-control mb-3">
          <label for="nameOverride" class="label"><span class="label-text">이름 override</span></label>
          <input id="nameOverride" type="text" th:field="*{nameOverride}" class="input input-bordered"/>
          <span class="text-xs text-base-content/60">비워두고 저장하면 AI 원본 값을 따릅니다.</span>
        </div>
        <div class="form-control mb-3">
          <label for="featureOverride" class="label"><span class="label-text">특징 override</span></label>
          <textarea id="featureOverride" th:field="*{featureOverride}" class="textarea textarea-bordered"></textarea>
          <span class="text-xs text-base-content/60">비워두고 저장하면 AI 원본 값을 따릅니다.</span>
        </div>
        <div class="form-control mb-3">
          <label for="childDescription" class="label"><span class="label-text">어린이 눈높이 설명</span></label>
          <textarea id="childDescription" th:field="*{childDescription}" class="textarea textarea-bordered"></textarea>
          <span class="text-error text-sm" th:if="${#fields.hasErrors('childDescription')}" th:errors="*{childDescription}"></span>
        </div>
        <div class="form-control mb-3">
          <label for="status" class="label"><span class="label-text">상태</span></label>
          <select id="status" th:field="*{status}" class="select select-bordered">
            <option value="AVAILABLE">AVAILABLE (수집 가능)</option>
            <option value="SUSPENDED">SUSPENDED (임시 중단)</option>
            <option value="RETIRED">RETIRED (운영 종료)</option>
          </select>
          <span class="text-error text-sm" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></span>
        </div>
        <div class="form-control mb-3">
          <label for="imageUrlOverride" class="label"><span class="label-text">이미지 URL override</span></label>
          <input id="imageUrlOverride" type="text" th:field="*{imageUrlOverride}" class="input input-bordered"/>
          <span class="text-xs text-base-content/60">비워두고 저장하면 AI 원본 값을 따릅니다.</span>
        </div>
        <div class="form-control mb-3">
          <label for="latitudeOverride" class="label"><span class="label-text">위도 override (장소 전용)</span></label>
          <input id="latitudeOverride" type="number" step="any" th:field="*{latitudeOverride}" class="input input-bordered"/>
        </div>
        <div class="form-control mb-4">
          <label for="longitudeOverride" class="label"><span class="label-text">경도 override (장소 전용)</span></label>
          <input id="longitudeOverride" type="number" step="any" th:field="*{longitudeOverride}" class="input input-bordered"/>
        </div>
        <button type="submit" class="btn btn-primary">저장</button>
      </form>
    </main>
  </div>
  <div th:replace="~{admin/fragments/layout :: sidebarNav(activePage='catalog-items')}"></div>
</div>
</body>
</html>
