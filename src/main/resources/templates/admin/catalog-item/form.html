<!DOCTYPE html>
<html th:replace="~{admin/fragments/layout :: page('도감 항목 수정', 'catalog-items', ~{::main}, ~{})}"
      xmlns:th="http://www.thymeleaf.org">
<body>
<main class="page">
  <div class="head">
    <h1>도감 항목 수정</h1>
    <div class="spacer"></div>
    <a th:href="@{/admin/catalog/items}" class="btn">목록으로</a>
  </div>
  <p class="subtitle">
    <span th:text="'현재 표시 이름: ' + ${item.name()}"></span> ·
    <span th:text="'카테고리: ' + ${item.category()}"></span>
  </p>
  <section class="card form-card">
    <h2>AI 원본 값 (참고용, override와 무관하게 항상 원본 그대로 표시)</h2>
    <div class="stack">
      <div>이름: <span th:text="${originalName}"></span></div>
      <div>특징: <span th:text="${originalFeature}"></span></div>
      <div th:if="${originalImageUrl != null}">이미지 URL: <span th:text="${originalImageUrl}"></span></div>
      <div th:if="${originalLatitude != null}">
        위도: <span th:text="${originalLatitude}"></span> / 경도: <span th:text="${originalLongitude}"></span>
      </div>
    </div>
  </section>
  <form th:action="@{'/admin/catalog/items/' + ${catalogItemId}}" th:object="${request}" method="post"
        class="card form-card">
    <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <div class="field">
      <label for="nameOverride">이름 override</label>
      <input id="nameOverride" type="text" th:field="*{nameOverride}"/>
      <span class="hint">비워두고 저장하면 AI 원본 값을 따릅니다.</span>
    </div>
    <div class="field">
      <label for="featureOverride">특징 override</label>
      <textarea id="featureOverride" th:field="*{featureOverride}" rows="4"></textarea>
      <span class="hint">비워두고 저장하면 AI 원본 값을 따릅니다.</span>
    </div>
    <div class="field">
      <label for="childDescription">어린이 눈높이 설명</label>
      <textarea id="childDescription" th:field="*{childDescription}" rows="4"></textarea>
      <span class="error-text" th:if="${#fields.hasErrors('childDescription')}" th:errors="*{childDescription}"></span>
    </div>
    <div class="field">
      <label for="status">상태</label>
      <select id="status" th:field="*{status}">
        <option value="AVAILABLE">AVAILABLE (수집 가능)</option>
        <option value="SUSPENDED">SUSPENDED (임시 중단)</option>
        <option value="RETIRED">RETIRED (운영 종료)</option>
      </select>
      <span class="error-text" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></span>
    </div>
    <div class="field">
      <label for="imageUrlOverride">이미지 URL override</label>
      <input id="imageUrlOverride" type="text" th:field="*{imageUrlOverride}"/>
      <span class="hint">비워두고 저장하면 AI 원본 값을 따릅니다.</span>
    </div>
    <div class="field">
      <label for="latitudeOverride">위도 override (장소 전용)</label>
      <input id="latitudeOverride" type="number" step="any" th:field="*{latitudeOverride}"/>
    </div>
    <div class="field">
      <label for="longitudeOverride">경도 override (장소 전용)</label>
      <input id="longitudeOverride" type="number" step="any" th:field="*{longitudeOverride}"/>
    </div>
    <div class="form-actions">
      <a th:href="@{/admin/catalog/items}" class="btn">취소</a>
      <button type="submit" class="btn primary">저장</button>
    </div>
  </form>
</main>
</body>
</html>
