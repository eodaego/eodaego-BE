<!DOCTYPE html>
<html th:replace="~{admin/fragments/layout :: page('날씨 조회', 'weather', ~{::main}, ~{})}"
      xmlns:th="http://www.thymeleaf.org">
<body>
<main class="page">
  <div class="head">
    <h1>날씨 조회</h1>
    <div class="spacer"></div>
    <form th:action="@{/admin/weather/crawl}" method="post">
      <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <button type="submit" class="btn primary">지금 수집</button>
    </form>
  </div>
  <div th:replace="~{admin/fragments/crawl-result :: single(result=${crawlResult})}"></div>
  <div class="toolbar"></div>
  <div id="weather-list">
    <th:block th:fragment="listRegion">
      <div class="tablewrap">
        <table>
          <thead>
          <tr><th>장소 키</th><th>기온(℃)</th><th>습도(%)</th><th>강수형태</th><th>풍속(m/s)</th><th>하늘상태</th><th>관측일시</th><th>수집일시</th></tr>
          </thead>
          <tbody>
          <tr th:each="snapshot : ${weatherSnapshots}">
            <td th:text="${snapshot.placeRefKey()}"></td>
            <td class="numeric" th:text="${snapshot.temperature()}"></td>
            <td class="numeric" th:text="${snapshot.humidity()}"></td>
            <td th:text="${snapshot.precipitationType()}"></td>
            <td class="numeric" th:text="${snapshot.windSpeed()}"></td>
            <td th:text="${snapshot.skyCondition()}"></td>
            <td th:text="${#temporals.format(snapshot.observedAt(), 'yyyy-MM-dd HH:mm')}"></td>
            <td th:text="${#temporals.format(snapshot.collectedAt(), 'yyyy-MM-dd HH:mm')}"></td>
          </tr>
          </tbody>
        </table>
        <div class="empty" th:if="${#lists.isEmpty(weatherSnapshots)}">수집된 날씨가 없습니다.</div>
      </div>
    </th:block>
  </div>
</main>
</body>
</html>
