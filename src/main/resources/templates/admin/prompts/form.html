<!DOCTYPE html>
<html th:replace="~{admin/fragments/layout :: page((${mode == 'create'} ? '프롬프트 템플릿 등록' : '프롬프트 템플릿 수정'), 'prompts', ~{::main}, ~{})}"
      xmlns:th="http://www.thymeleaf.org">
<body>
<main class="page">
  <div class="head"><h1 th:text="${mode == 'create'} ? '프롬프트 템플릿 등록' : '프롬프트 템플릿 수정'"></h1></div>
  <form th:action="${mode == 'create'} ? @{/admin/prompts} : @{'/admin/prompts/' + ${promptId}}"
        th:object="${request}" method="post" class="card form-card wide">
    <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <div class="field">
      <label for="name">이름</label>
      <input id="name" type="text" th:field="*{name}"/>
      <span class="error-text" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
    </div>
    <div class="field">
      <label for="purpose">용도</label>
      <select id="purpose" th:field="*{purpose}">
        <option th:each="purposeOption : ${purposes}" th:value="${purposeOption}" th:text="${purposeOption}"></option>
      </select>
      <span class="error-text" th:if="${#fields.hasErrors('purpose')}" th:errors="*{purpose}"></span>
    </div>
    <div class="field">
      <label for="templateText">템플릿 내용</label>
      <textarea id="templateText" th:field="*{templateText}" rows="12"></textarea>
      <span class="error-text" th:if="${#fields.hasErrors('templateText')}" th:errors="*{templateText}"></span>
    </div>
    <label th:if="${mode == 'edit'}" class="check" for="active">
      <input id="active" type="checkbox" th:field="*{active}"/>
      <span>활성화</span>
    </label>
    <p th:if="${mode == 'create'}" class="note">
      새 프롬프트는 항상 비활성 상태로 생성됩니다. Provider를 최소 1개 이상 등록한 후 활성화할 수 있습니다.
    </p>
    <div class="form-actions">
      <a th:href="@{/admin/prompts}" class="btn">취소</a>
      <button type="submit" class="btn primary">저장</button>
    </div>
  </form>

  <section th:if="${mode == 'edit'}" class="card form-card wide">
    <h2>LLM Provider</h2>
    <p th:if="${#lists.isEmpty(providers)}" class="note">
      등록된 provider가 없습니다 — 이 상태로는 해당 purpose의 API가 503을 반환합니다.
    </p>
    <form th:each="provider : ${providers}"
          th:action="@{'/admin/prompts/' + ${promptId} + '/providers/' + ${provider.id()}}" method="post"
          class="inline-fields">
      <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <div class="field">
        <label th:for="'provider-' + ${provider.id()}">Provider</label>
        <select th:id="'provider-' + ${provider.id()}" name="provider">
          <option value="SUH_AIDER" th:selected="${provider.provider() == 'SUH_AIDER'}">SUH_AIDER</option>
          <option value="GEMINI" th:selected="${provider.provider() == 'GEMINI'}">GEMINI</option>
        </select>
      </div>
      <div class="field">
        <label th:for="'model-' + ${provider.id()}">모델</label>
        <input th:id="'model-' + ${provider.id()}" type="text" name="model" th:value="${provider.model()}"/>
      </div>
      <div class="field">
        <label th:for="'priority-' + ${provider.id()}">우선순위</label>
        <input th:id="'priority-' + ${provider.id()}" type="number" name="priority" th:value="${provider.priority()}"/>
      </div>
      <label class="check">
        <input type="hidden" name="_enabled" value="on"/>
        <input type="checkbox" name="enabled" th:checked="${provider.enabled()}"/>
        <span>활성</span>
      </label>
      <button type="submit" class="btn sm">저장</button>
      <button type="submit" class="btn sm danger"
              th:formaction="@{'/admin/prompts/' + ${promptId} + '/providers/' + ${provider.id()} + '/delete'}"
              th:attr="data-confirm='Provider ' + ${provider.provider()} + '을(를) 삭제합니다. 되돌릴 수 없습니다.'">삭제</button>
    </form>

    <h2>Provider 추가</h2>
    <form th:action="@{'/admin/prompts/' + ${promptId} + '/providers'}" th:object="${newProviderRequest}"
          method="post" class="inline-fields">
      <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <div class="field">
        <label for="newProvider">Provider</label>
        <select id="newProvider" th:field="*{provider}">
          <option value="SUH_AIDER">SUH_AIDER</option>
          <option value="GEMINI">GEMINI</option>
        </select>
      </div>
      <div class="field">
        <label for="newModel">모델</label>
        <input id="newModel" type="text" th:field="*{model}"/>
      </div>
      <div class="field">
        <label for="newPriority">우선순위</label>
        <input id="newPriority" type="number" th:field="*{priority}"/>
      </div>
      <label class="check" for="newEnabled">
        <input id="newEnabled" type="checkbox" th:field="*{enabled}"/>
        <span>활성</span>
      </label>
      <button type="submit" class="btn sm primary">추가</button>
    </form>
  </section>
</main>
</body>
</html>
