<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>행사·공연 관리 - 어대고 관리자</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css"/>
</head>
<body class="min-h-screen bg-base-200">
<div class="drawer lg:drawer-open">
  <input id="admin-drawer" type="checkbox" class="drawer-toggle"/>
  <div class="drawer-content flex flex-col">
    <div th:replace="~{admin/fragments/layout :: mobileTopbar}"></div>
    <main class="p-8">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold">행사·공연 관리</h2>
        <form th:action="@{/admin/events/crawl}" method="post">
          <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit" class="btn btn-primary btn-sm">지금 수집</button>
        </form>
      </div>
      <div th:replace="~{admin/fragments/crawl-result :: single(result=${crawlResult})}"></div>
      <div class="overflow-x-auto bg-base-100 rounded-box shadow">
        <table class="table">
          <thead>
          <tr>
            <th>행사명</th>
            <th>장소</th>
            <th>시작일</th>
            <th>종료일</th>
            <th>이용대상</th>
            <th>이용요금</th>
            <th>홈페이지</th>
            <th>수정일시</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="event : ${events}">
            <td th:text="${event.title()}"></td>
            <td th:text="${event.place()}"></td>
            <td th:text="${event.startDate()}"></td>
            <td th:text="${event.endDate()}"></td>
            <td th:text="${event.target()}"></td>
            <td th:text="${event.fee()}"></td>
            <td>
              <a th:if="${event.homepageUrl() != null}" th:href="${event.homepageUrl()}" target="_blank" class="link link-primary">바로가기</a>
            </td>
            <td th:text="${event.updatedAt()}"></td>
          </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
  <div th:replace="~{admin/fragments/layout :: sidebarNav(activePage='events')}"></div>
</div>
</body>
</html>
