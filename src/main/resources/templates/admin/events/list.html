<!DOCTYPE html>
<html th:replace="~{admin/fragments/layout :: page('행사·공연 관리', 'events', ~{::main}, ~{})}"
      xmlns:th="http://www.thymeleaf.org">
<body>
<main class="page">
  <div class="head">
    <h1>행사·공연 관리</h1>
    <div class="spacer"></div>
    <form th:action="@{/admin/events/crawl}" method="post">
      <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <button type="submit" class="btn primary">지금 수집</button>
    </form>
  </div>
  <div th:replace="~{admin/fragments/crawl-result :: single(result=${crawlResult})}"></div>
  <div class="toolbar">
    <form id="events-search" th:action="@{/admin/events}" method="get">
      <label class="search" style="min-width:220px">
        <span aria-hidden="true">⌕</span>
        <input type="search" name="keyword" th:value="${keyword}" placeholder="행사명·장소 검색" aria-label="행사명·장소 검색"
               hx-get="/admin/events" hx-target="#events-list" hx-push-url="true"
               hx-trigger="input changed delay:300ms, search" hx-include="#events-sort-state"/>
      </label>
    </form>
  </div>
  <div id="events-list">
    <th:block th:fragment="listRegion">
      <div id="events-sort-state">
        <input type="hidden" form="events-search" name="sort" th:value="${sort ?: ''}"/>
        <input type="hidden" form="events-search" name="direction" th:value="${direction ?: ''}"/>
      </div>
      <div class="tools">
        <span class="subtitle" th:text="'총 ' + ${page.totalElements} + '건'"></span>
      </div>
      <div class="tablewrap">
        <table>
          <thead>
          <tr>
            <th th:replace="~{admin/fragments/components :: sortHeader('행사명', 'title')}"></th>
            <th th:replace="~{admin/fragments/components :: sortHeader('장소', 'place')}"></th>
            <th th:replace="~{admin/fragments/components :: sortHeader('시작일', 'startDate')}"></th>
            <th th:replace="~{admin/fragments/components :: sortHeader('종료일', 'endDate')}"></th>
            <th>이용대상</th><th>이용요금</th><th>홈페이지</th>
            <th th:replace="~{admin/fragments/components :: sortHeader('수정일시', 'updatedAt')}"></th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="event : ${page.content}">
            <td th:text="${event.title()}"></td>
            <td th:text="${event.place()}"></td>
            <td th:text="${event.startDate()}"></td>
            <td th:text="${event.endDate()}"></td>
            <td th:text="${event.target()}"></td>
            <td th:text="${event.fee()}"></td>
            <td><a th:if="${event.homepageUrl() != null}" th:href="${event.homepageUrl()}" target="_blank" rel="noopener noreferrer">바로가기</a></td>
            <td th:text="${#temporals.format(event.updatedAt(), 'yyyy-MM-dd HH:mm')}"></td>
          </tr>
          </tbody>
        </table>
        <div class="empty" th:if="${#lists.isEmpty(page.content)}">조건에 맞는 행사가 없습니다.</div>
      </div>
      <div th:replace="~{admin/fragments/components :: pager(${page})}"></div>
    </th:block>
  </div>
</main>
</body>
</html>
