<!DOCTYPE html>
<html th:replace="~{admin/fragments/layout :: page('취향 매핑 등록', 'preference-mappings', ~{::main}, ~{})}"
      xmlns:th="http://www.thymeleaf.org">
<body>
<main class="page">
  <div class="head"><h1>취향 매핑 등록</h1></div>
  <form th:action="@{/admin/recommendation/preference-mappings}" th:object="${request}" method="post"
        class="card form-card">
    <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <div class="field">
      <label for="preferenceTag">취향 태그</label>
      <select id="preferenceTag" th:field="*{preferenceTag}">
        <option th:each="tag : ${preferenceTags}" th:value="${tag}" th:text="${tag}"></option>
      </select>
      <span class="error-text" th:if="${#fields.hasErrors('preferenceTag')}" th:errors="*{preferenceTag}"></span>
    </div>
    <div class="field">
      <label for="category">시설 카테고리</label>
      <select id="category" th:field="*{category}">
        <option th:each="category : ${categories}" th:value="${category}" th:text="${category}"></option>
      </select>
      <span class="error-text" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></span>
    </div>
    <div class="form-actions">
      <a th:href="@{/admin/recommendation/preference-mappings}" class="btn">취소</a>
      <button type="submit" class="btn primary">저장</button>
    </div>
  </form>
</main>
</body>
</html>
